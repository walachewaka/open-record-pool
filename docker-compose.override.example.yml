# Example local override (copy to docker-compose.override.yml, which is gitignored).
#
# Points the read-only /music volume at real MP3s on the host instead of the
# built-in fixtures. On Docker Desktop for Windows the host path must be given as
# the Docker VM path (/run/desktop/mnt/host/c/...). See INSTALL.md.
#
# The owner's original (lost) override bound /music at C:\Users\spardiac\Downloads\EDM Madness.
# Changing an existing volume's device requires `docker volume rm open-record-pool_music-data`
# first (compose won't alter an existing volume), then a rescan.

services:
  backend:
    volumes:
      - music-data:/music:ro

volumes:
  music-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /run/desktop/mnt/host/c/Users/spardiac/Downloads/EDM Madness
