# NGINX config for the all-in-one image: serve the built Vue.js frontend (#26).
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # vue-router history mode: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
