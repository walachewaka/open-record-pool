; supervisord program definitions for the all-in-one image (#26).
; The main supervisord.conf (shipped with the image) includes this file from
; /etc/supervisor/conf.d/.

[program:backend]
; docker-entrypoint.sh waits for the DB, applies migrations, then execs uvicorn.
command=/app/docker-entrypoint.sh uvicorn src.main:app --host 0.0.0.0 --port 5000
directory=/app
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
