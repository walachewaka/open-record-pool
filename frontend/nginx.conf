# NGINX config for serving the production build of the Vue.js frontend (#23).
# Runs under the unprivileged NGINX image (UID 101), so it listens on 8080
# rather than the privileged port 80 (MOO-89); compose maps 127.0.0.1:8088:8080.
server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (MOO-89), set at SERVER level. NOTE: an add_header inside
    # a location block REPLACES all inherited add_header directives, so do NOT
    # add add_header inside the locations below -- keep every header here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: no unsafe-inline (prod webpack extracts CSS to files; Vue sets styles
    # via CSSOM, which CSP does not block). fonts.googleapis/gstatic are allowed
    # for the Google Fonts used in index.html. media-src/connect-src/frame-src
    # point at the baked backend URL (http://localhost:5000) -- deployments that
    # override VUE_APP_BACKEND_URL must edit those three directives to match.
    # frame-src carries the admin Insights page (MOO-83): the Grafana dashboards
    # are framed from the backend's authenticated /admin/grafana proxy, never
    # from Grafana directly (it has no published port).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' http://localhost:5000; connect-src 'self' http://localhost:5000; frame-src 'self' http://localhost:5000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The app uses vue-router in "history" mode, so any unknown path must fall
    # back to index.html and let the client-side router resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for the hashed build assets.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
